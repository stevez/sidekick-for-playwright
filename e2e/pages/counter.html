<!doctype html>
<title>Counter link</title>
<style>.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }</style>
<!-- Same markup as GitHub's "Closed (20)" tab: a visible counter hidden from screen readers, and screen-reader-only text -->
<a href="#closed"><div>Closed</div><span aria-hidden="true">20</span><span class="visually-hidden">&nbsp;(20)</span></a>
